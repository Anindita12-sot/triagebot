<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TriageBot</title>
  <link rel="icon" href="/static/KIIT-logo-HD.png" />
  <style>
    /* ---------- Design tokens ---------- */
    :root, [data-theme="dark"] {
      --bg: #0a0e1a;
      --bg-glow-1: rgba(34, 197, 94, 0.16);
      --bg-glow-2: rgba(99, 102, 241, 0.14);
      --panel: #121829;
      --panel-2: #1a2138;
      --panel-3: #212a45;
      --border: #273150;
      --text: #eef1f8;
      --muted: #98a2c0;
      --accent: #22c55e;
      --accent-strong: #16a34a;
      --pill-active-bg: #ffffff;
      --pill-active-text: #0a0e1a;
      --card-shadow: 0 12px 34px rgba(0, 0, 0, 0.45);
      --card-shadow-hover: 0 18px 46px rgba(0, 0, 0, 0.55);
      --glow: 0 6px 22px rgba(34, 197, 94, 0.45);
      --pill-hover-shadow: 0 6px 20px rgba(255, 255, 255, 0.18);
      --input-bg: #1a2138;
    }
    [data-theme="light"] {
      --bg: #eef1f7;
      --bg-glow-1: rgba(34, 197, 94, 0.20);
      --bg-glow-2: rgba(99, 102, 241, 0.14);
      --panel: #ffffff;
      --panel-2: #f4f6fb;
      --panel-3: #eceff6;
      --border: #dde3ee;
      --text: #0f1626;
      --muted: #5b6478;
      --accent: #16a34a;
      --accent-strong: #15803d;
      --pill-active-bg: #0f1626;
      --pill-active-text: #ffffff;
      --card-shadow: 0 10px 28px rgba(19, 30, 60, 0.10);
      --card-shadow-hover: 0 16px 40px rgba(19, 30, 60, 0.16);
      --glow: 0 6px 22px rgba(22, 163, 74, 0.35);
      --pill-hover-shadow: 0 6px 20px rgba(15, 22, 38, 0.16);
      --input-bg: #f4f6fb;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 12% -8%, var(--bg-glow-1), transparent 60%),
        radial-gradient(800px 500px at 100% 0%, var(--bg-glow-2), transparent 55%),
        var(--bg);
      background-attachment: fixed;
      min-height: 100vh;
      transition: background-color 0.35s ease, color 0.35s ease;
    }

    /* ---------- Top navbar ---------- */
    .nav {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: 16px;
      padding: 12px 22px;
      background: color-mix(in srgb, var(--panel) 82%, transparent);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { height: 38px; width: auto; display: block; }
    .brand .name {
      font-weight: 800; font-size: 1.15rem; letter-spacing: 0.2px;
      background: linear-gradient(90deg, var(--accent), #6366f1);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .brand .sub { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

    .nav-links { display: flex; align-items: center; gap: 6px; margin-left: 10px; }
    .nav-pill {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 16px; border-radius: 999px;
      color: var(--muted); font-weight: 600; font-size: 0.9rem;
      text-decoration: none; cursor: pointer; border: none; background: transparent;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, color 0.18s ease;
    }
    /* Shadow hover like the "Home" pill button */
    .nav-pill:hover {
      background: color-mix(in srgb, var(--panel-3) 80%, transparent);
      color: var(--text);
      transform: translateY(-1px);
      box-shadow: var(--pill-hover-shadow);
    }
    .nav-pill.active {
      background: var(--pill-active-bg);
      color: var(--pill-active-text);
      box-shadow: var(--pill-hover-shadow);
    }

    .nav-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--panel-2); color: var(--text); cursor: pointer; font-size: 1.05rem;
      display: grid; place-items: center;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }
    .icon-btn:hover { transform: translateY(-1px); box-shadow: var(--pill-hover-shadow); }
    .user-chip {
      display: flex; align-items: center; gap: 9px;
      padding: 5px 6px 5px 12px; border-radius: 999px;
      background: var(--panel-2); border: 1px solid var(--border);
    }
    .user-chip .uname { font-size: 0.85rem; font-weight: 600; }
    .avatar {
      width: 30px; height: 30px; border-radius: 999px; display: grid; place-items: center;
      font-weight: 800; font-size: 0.8rem; color: #fff;
      background: linear-gradient(135deg, var(--accent), #6366f1);
    }
    .logout {
      border: none; background: transparent; color: var(--muted); cursor: pointer;
      font-size: 0.82rem; padding: 6px 10px; border-radius: 8px;
    }
    .logout:hover { color: var(--text); }

    /* ---------- Layout ---------- */
    .wrap { max-width: 860px; margin: 0 auto; padding: 26px 20px 70px; }
    .hero { text-align: center; margin-bottom: 22px; }
    .hero h1 { margin: 0; font-size: 1.9rem; font-weight: 800; }
    .hero p { color: var(--muted); margin: 8px 0 0; }

    /* ---------- Cards ---------- */
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      box-shadow: var(--card-shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .card.compose { margin-bottom: 22px; }

    label { display: block; font-size: 0.82rem; color: var(--muted); margin: 10px 0 6px; font-weight: 600; }
    input, textarea {
      width: 100%; background: var(--input-bg); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text); padding: 12px 14px; font-size: 0.95rem;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }
    select {
      width: 100%; background: var(--input-bg); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text); padding: 12px 14px; font-size: 0.95rem;
      cursor: pointer; transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }
    input:focus, textarea:focus, select:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
    }
    textarea { resize: vertical; min-height: 76px; }

    .btn {
      margin-top: 14px; cursor: pointer; border: none; border-radius: 12px;
      padding: 12px 20px; font-weight: 700; font-size: 0.95rem; color: #fff;
      background: linear-gradient(90deg, var(--accent), var(--accent-strong));
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: var(--glow); filter: saturate(1.1); }
    .btn:active { transform: translateY(0); }
    .btn.block { width: 100%; }

    .preview {
      font-size: 0.85rem; color: var(--muted); margin-top: 14px;
      padding: 12px 14px; border-radius: 12px; background: var(--panel-2);
      border: 1px dashed var(--border); min-height: 20px; line-height: 1.5;
    }

    .list-head { display: flex; align-items: center; justify-content: space-between; margin: 26px 4px 12px; }
    .list-head h2 { font-size: 1.05rem; margin: 0; }
    .count { font-size: 0.8rem; color: var(--muted); background: var(--panel-2);
             padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); }

    /* Issue cards with hover lift + shadow */
    .issue {
      display: flex; align-items: flex-start; gap: 14px; padding: 16px;
      border-radius: 16px; background: var(--panel); border: 1px solid var(--border);
      box-shadow: var(--card-shadow); margin-bottom: 12px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .issue:hover { transform: translateY(-3px); box-shadow: var(--card-shadow-hover);
                   border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
    .issue.closed .title { text-decoration: line-through; opacity: 0.55; }
    .issue .title { font-weight: 700; font-size: 1rem; }
    .issue .reason { font-size: 0.78rem; color: var(--muted); margin-top: 8px; line-height: 1.5; }
    .badges { margin-top: 9px; }
    .badge {
      display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px;
      font-size: 0.72rem; font-weight: 800; margin: 0 6px 6px 0; border: 1px solid transparent;
    }
    .s-urgent { background: rgba(239,68,68,.16); color: #ef4444; border-color: rgba(239,68,68,.4); }
    .s-high   { background: rgba(245,158,11,.16); color: #f59e0b; border-color: rgba(245,158,11,.4); }
    .s-medium { background: rgba(99,102,241,.16); color: #818cf8; border-color: rgba(99,102,241,.4); }
    .s-low    { background: rgba(6,182,212,.16); color: #22d3ee; border-color: rgba(6,182,212,.4); }
    .label    { background: var(--panel-3); color: var(--muted); border-color: var(--border); }
    .owner    { background: color-mix(in srgb, var(--accent) 16%, transparent);
                color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }

    .check { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); cursor: pointer; }
    .grow { flex: 1; min-width: 0; }
    .del {
      border: 1px solid var(--border); background: transparent; color: var(--muted);
      border-radius: 10px; padding: 7px 12px; font-size: 0.8rem; cursor: pointer;
      transition: all 0.18s ease;
    }
    .del:hover { color: #ef4444; border-color: rgba(239,68,68,.5); box-shadow: 0 6px 16px rgba(239,68,68,.2); }
    .empty { color: var(--muted); text-align: center; padding: 30px; border: 1px dashed var(--border); border-radius: 16px; }

    /* ---------- Login screen ---------- */
    .login-overlay {
      position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px;
      background:
        radial-gradient(700px 420px at 20% 0%, var(--bg-glow-1), transparent 60%),
        radial-gradient(700px 420px at 90% 100%, var(--bg-glow-2), transparent 60%),
        var(--bg);
    }
    .login-card {
      width: 100%; max-width: 400px; text-align: center;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 22px; padding: 34px 30px; box-shadow: var(--card-shadow);
    }
    .login-card img { height: 66px; margin-bottom: 10px; }
    .login-card h2 { margin: 6px 0 2px; font-size: 1.35rem; }
    .login-card .tag { color: var(--muted); font-size: 0.86rem; margin-bottom: 20px; }
    .login-card label { text-align: left; }
    .switch-row { margin-top: 18px; font-size: 0.85rem; color: var(--muted); }
    .link-btn {
      border: none; background: transparent; color: var(--accent);
      font-weight: 700; font-size: 0.85rem; cursor: pointer; padding: 2px 4px;
      text-decoration: underline; text-underline-offset: 3px;
    }
    .link-btn:hover { color: var(--accent-strong); }
    .err { color: #ef4444; font-size: 0.8rem; min-height: 16px; margin-top: 8px; }
    .err.ok { color: var(--accent); }
    .hidden { display: none !important; }

    @media (max-width: 620px) {
      .brand .sub, .nav-links { display: none; }
      .user-chip .uname { display: none; }
    }
  </style>
</head>
<body>
  <!-- ---------- Login screen ---------- -->
  <div id="login" class="login-overlay">
    <form class="login-card" id="loginForm" autocomplete="off">
      <img src="/static/KIIT-logo-HD.png" alt="KIIT" />
      <h2 id="loginTitle">Welcome to TriageBot</h2>
      <div class="tag" id="loginTag">Sign in to triage your team's incoming issues</div>
      <label for="lname">Username</label>
      <input id="lname" placeholder="e.g. Anindita" />

      <div class="signup-only hidden">
        <label for="lfull">Full name</label>
        <input id="lfull" placeholder="e.g. Anindita Sahoo" />
      </div>
      <div class="signup-only hidden">
        <label for="lyear">Year</label>
        <select id="lyear">
          <option value="">Select year</option>
          <option>1st Year</option>
          <option>2nd Year</option>
          <option>3rd Year</option>
          <option>4th Year</option>
        </select>
      </div>
      <div class="signup-only hidden">
        <label for="lbranch">Stream / Branch</label>
        <select id="lbranch">
          <option value="">Select stream</option>
          <option>Computer Science</option>
          <option>Information Technology</option>
          <option>Electronics &amp; Communication</option>
          <option>Electrical</option>
          <option>Mechanical</option>
          <option>Civil</option>
          <option>Other</option>
        </select>
      </div>

      <label for="lpass">Password</label>
      <input id="lpass" type="password" placeholder="••••••••" />
      <div id="confirmRow" class="signup-only hidden">
        <label for="lpass2">Confirm password</label>
        <input id="lpass2" type="password" placeholder="••••••••" />
      </div>
      <div class="err" id="loginErr"></div>
      <button class="btn block" type="submit" id="loginBtn">Sign in</button>
      <div class="switch-row">
        <span id="switchText">New here?</span>
        <button type="button" class="link-btn" id="switchMode">Create an account</button>
      </div>
    </form>
  </div>

  <!-- ---------- App ---------- -->
  <div id="app" class="hidden">
    <nav class="nav">
      <div class="brand">
        <img src="/static/KIIT-logo-HD.png" alt="KIIT logo" />
        <div>
          <div class="name">TriageBot</div>
          <div class="sub">HowToAlgo x GDG on Campus KIIT</div>
        </div>
      </div>
      <div class="nav-links">
        <button class="nav-pill active" data-view="triage">Dashboard</button>
      </div>
      <div class="nav-right">
        <button class="icon-btn" id="themeBtn" title="Toggle light / dark">🌙</button>
        <div class="user-chip">
          <span class="avatar" id="avatar">U</span>
          <span class="uname" id="uname">user</span>
          <button class="logout" id="logoutBtn">Logout</button>
        </div>
      </div>
    </nav>

    <div class="wrap">
      <div class="hero">
        <h1>Triage an incoming issue</h1>
        <p>The assistant suggests severity, labels &amp; the likely owner — with a reason.</p>
      </div>

      <div class="card compose">
        <label for="title">Issue title</label>
        <input id="title" placeholder="e.g. API returns 500 on login, users can't sign in" />
        <label for="body">Body (optional)</label>
        <textarea id="body" placeholder="Steps to reproduce, stack traces, context..."></textarea>
        <div class="preview" id="preview">Start typing to see the triage suggestion…</div>
        <button class="btn" id="addBtn">Triage &amp; save</button>
      </div>

      <div class="list-head">
        <h2>Triaged issues</h2>
        <span class="count" id="count">0</span>
      </div>
      <div id="list"></div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const api = (path, opts) => fetch(path, opts).then((r) => (r.status === 204 ? null : r.json()));
    const escapeHtml = (s) => String(s).replace(/[&<>"']/g,
      (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    /* ---------- Theme ---------- */
    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem("tb_theme", theme);
      $("themeBtn").textContent = theme === "dark" ? "🌙" : "☀️";
    }
    applyTheme(localStorage.getItem("tb_theme") || "dark");
    $("themeBtn").addEventListener("click", () => {
      applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
    });

    /* ---------- Login ---------- */
    function showApp(user, profile) {
      $("login").classList.add("hidden");
      $("app").classList.remove("hidden");
      $("uname").textContent = user;
      $("avatar").textContent = (user[0] || "U").toUpperCase();
      const chip = document.querySelector(".user-chip");
      if (profile && (profile.year || profile.branch)) {
        chip.title = [profile.year, profile.branch].filter(Boolean).join(" · ");
      } else {
        chip.removeAttribute("title");
      }
      refresh();
    }
    function checkSession() {
      const key = localStorage.getItem("tb_user");
      if (!key) return;
      const rec = getUsers()[key];
      if (rec) showApp(rec.display || key, rec);
      else showApp(key);
    }
    let authMode = "signin";
    function setMode(mode) {
      authMode = mode;
      const signup = mode === "signup";
      document.querySelectorAll(".signup-only").forEach((el) => el.classList.toggle("hidden", !signup));
      $("loginTitle").textContent = signup ? "Create your account" : "Welcome to TriageBot";
      $("loginTag").textContent = signup
        ? "Sign up to start triaging issues"
        : "Sign in to triage your team's incoming issues";
      $("loginBtn").textContent = signup ? "Create account" : "Sign in";
      $("switchText").textContent = signup ? "Already have an account?" : "New here?";
      $("switchMode").textContent = signup ? "Sign in" : "Create an account";
      $("loginErr").textContent = "";
      $("loginErr").classList.remove("ok");
    }
    $("switchMode").addEventListener("click", () =>
      setMode(authMode === "signin" ? "signup" : "signin"));

    async function sha256(text) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
    }
    const getUsers = () => { try { return JSON.parse(localStorage.getItem("tb_users") || "{}"); } catch { return {}; } };
    const saveUsers = (u) => localStorage.setItem("tb_users", JSON.stringify(u));

    const setErr = (m) => { const e = $("loginErr"); e.classList.remove("ok"); e.textContent = m; };
    const setOk = (m) => { const e = $("loginErr"); e.classList.add("ok"); e.textContent = m; };

    $("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = $("lname").value.trim();
      const pass = $("lpass").value;
      if (name.length < 2) return setErr("Enter a username (2+ characters).");
      if (pass.length < 4) return setErr("Password must be at least 4 characters.");

      const users = getUsers();
      const key = name.toLowerCase();
      const hash = await sha256(pass);

      if (authMode === "signup") {
        const year = $("lyear").value;
        const branch = $("lbranch").value;
        if (!year) return setErr("Please select your year.");
        if (!branch) return setErr("Please select your stream / branch.");
        if ($("lpass2").value !== pass) return setErr("Passwords do not match.");
        if (users[key]) return setErr("That username already exists. Try signing in.");

        users[key] = { hash, display: name, full: $("lfull").value.trim(), year, branch };
        saveUsers(users);

        // Do NOT auto-login. Send the user to the sign-in screen.
        setMode("signin");
        $("lpass").value = "";
        $("lpass2").value = "";
        setOk("Account created — please sign in to continue.");
        $("lpass").focus();
        return;
      }

      const rec = users[key];
      if (!rec || rec.hash !== hash) return setErr("Invalid username or password.");
      localStorage.setItem("tb_user", key);
      showApp(rec.display || name, rec);
    });

    $("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("tb_user");
      $("app").classList.add("hidden");
      $("login").classList.remove("hidden");
      $("lname").value = ""; $("lpass").value = ""; $("lpass2").value = "";
      setMode("signin");
    });

    /* ---------- Triage UI ---------- */
    function badges(x) {
      const labels = x.labels.map((l) => `<span class="badge label">${escapeHtml(l)}</span>`).join("");
      return `<span class="badge s-${x.severity}">${x.severity}</span>${labels}` +
             `<span class="badge owner">@${escapeHtml(x.owner)}</span>`;
    }

    async function refresh() {
      const issues = await api("/issues");
      $("count").textContent = issues.length;
      const list = $("list");
      if (!issues.length) {
        list.innerHTML = '<div class="empty">No issues yet. Triage one above.</div>';
        return;
      }
      list.innerHTML = issues.map((it) => `
        <div class="issue ${it.status === "closed" ? "closed" : ""}">
          <input class="check" type="checkbox" ${it.status === "closed" ? "checked" : ""}
                 title="Mark closed" onchange="toggle(${it.id}, this.checked)" />
          <div class="grow">
            <div class="title">${escapeHtml(it.title)}</div>
            <div class="badges">${badges(it)}</div>
            <div class="reason">${escapeHtml(it.reason)}</div>
          </div>
          <button class="del" onclick="remove(${it.id})">Delete</button>
        </div>`).join("");
    }

    async function add() {
      const title = $("title").value.trim();
      if (!title) return;
      await api("/issues", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, body: $("body").value }),
      });
      $("title").value = ""; $("body").value = "";
      $("preview").textContent = "Start typing to see the triage suggestion…";
      refresh();
    }

    async function preview() {
      const title = $("title").value.trim();
      if (!title) { $("preview").textContent = "Start typing to see the triage suggestion…"; return; }
      const res = await api("/triage", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, body: $("body").value }),
      });
      $("preview").innerHTML =
        `<b>Suggestion:</b> ${badges(res)}<br/><span style="opacity:.85">${escapeHtml(res.reason)}</span>`;
    }

    async function toggle(id, closed) {
      await api(`/issues/${id}`, {
        method: "PATCH", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status: closed ? "closed" : "open" }),
      });
      refresh();
    }
    async function remove(id) { await api(`/issues/${id}`, { method: "DELETE" }); refresh(); }

    window.toggle = toggle;
    window.remove = remove;
    $("addBtn").addEventListener("click", add);
    let t;
    const debounced = () => { clearTimeout(t); t = setTimeout(preview, 250); };
    $("title").addEventListener("input", debounced);
    $("body").addEventListener("input", debounced);

    checkSession();
  </script>
</body>
</html>
