[project]
name = "triagebot"
version = "1.0.0"
description = "TriageBot - an incoming-issue triage assistant that suggests severity, labels, and likely owners."
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# A small, sensible rule set for a student project:
# E/W = pycodestyle, F = pyflakes, I = isort, UP = pyupgrade, B = bugbear
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]  # line-length handled by formatter; don't fail CI on long lines
